<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a958c"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#141312"/>

  <!-- legend -->
  <g font-size="11">
    <rect x="600" y="18" width="10" height="10" rx="2" fill="#6b9dff"/>
    <text x="616" y="27" fill="#9a958c">LLM judgment</text>
    <rect x="720" y="18" width="10" height="10" rx="2" fill="#9a958c"/>
    <text x="736" y="27" fill="#9a958c">deterministic</text>
    <rect x="850" y="18" width="10" height="10" rx="2" fill="#d8a24a"/>
    <text x="866" y="27" fill="#9a958c">human</text>
  </g>

  <!-- ROW 1: the main loop -->
  <g>
    <rect x="20" y="70" width="150" height="100" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="20" y="70" width="150" height="6" rx="3" fill="#9a958c"/>
    <text x="34" y="96" fill="#e8e6e3" font-size="13" font-weight="600">Gmail intake</text>
    <text x="34" y="116" fill="#9a958c" font-size="11.5">labeled client mail,</text>
    <text x="34" y="132" fill="#9a958c" font-size="11.5">daily 08:00 run</text>
    <text x="34" y="152" fill="#7a766e" font-size="10.5">read-only, no send — ever</text>
  </g>
  <line x1="170" y1="120" x2="204" y2="120" stroke="#9a958c" stroke-width="1.5" marker-end="url(#arr)"/>

  <g>
    <rect x="210" y="70" width="180" height="100" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="210" y="70" width="180" height="6" rx="3" fill="#9a958c"/>
    <text x="224" y="96" fill="#e8e6e3" font-size="13" font-weight="600">Sender match</text>
    <text x="224" y="116" fill="#9a958c" font-size="11.5">deterministic lookup</text>
    <text x="224" y="132" fill="#9a958c" font-size="11.5">against per-project</text>
    <text x="224" y="148" fill="#9a958c" font-size="11.5">contact allowlists</text>
  </g>
  <line x1="390" y1="120" x2="424" y2="120" stroke="#9a958c" stroke-width="1.5" marker-end="url(#arr)"/>

  <g>
    <rect x="430" y="70" width="190" height="100" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="430" y="70" width="190" height="6" rx="3" fill="#6b9dff"/>
    <text x="444" y="96" fill="#e8e6e3" font-size="13" font-weight="600">Proposed entry</text>
    <text x="444" y="116" fill="#9a958c" font-size="11.5">plain-language summary,</text>
    <text x="444" y="132" fill="#9a958c" font-size="11.5">topic tag, source link</text>
    <text x="444" y="152" fill="#7a766e" font-size="10.5">propose, never auto-commit</text>
  </g>
  <line x1="620" y1="120" x2="654" y2="120" stroke="#9a958c" stroke-width="1.5" marker-end="url(#arr)"/>

  <g>
    <rect x="660" y="70" width="120" height="100" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="660" y="70" width="120" height="6" rx="3" fill="#d8a24a"/>
    <text x="674" y="96" fill="#e8e6e3" font-size="13" font-weight="600">Human</text>
    <text x="674" y="116" fill="#9a958c" font-size="11.5">confirms or</text>
    <text x="674" y="132" fill="#9a958c" font-size="11.5">corrects</text>
  </g>
  <line x1="780" y1="120" x2="814" y2="120" stroke="#9a958c" stroke-width="1.5" marker-end="url(#arr)"/>

  <g>
    <rect x="820" y="70" width="120" height="100" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="820" y="70" width="120" height="6" rx="3" fill="#9a958c"/>
    <text x="834" y="96" fill="#e8e6e3" font-size="13" font-weight="600">The record</text>
    <text x="834" y="116" fill="#9a958c" font-size="11.5">structured log</text>
    <text x="834" y="132" fill="#9a958c" font-size="11.5">per project</text>
  </g>

  <!-- branches from match -->
  <line x1="255" y1="170" x2="255" y2="224" stroke="#9a958c" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arr)"/>
  <line x1="345" y1="170" x2="345" y2="224" stroke="#9a958c" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arr)"/>

  <g>
    <rect x="170" y="230" width="170" height="80" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="170" y="230" width="170" height="6" rx="3" fill="#d8a24a"/>
    <text x="184" y="256" fill="#e8e6e3" font-size="12.5" font-weight="600">No match → triage</text>
    <text x="184" y="276" fill="#9a958c" font-size="11">flagged for a human —</text>
    <text x="184" y="291" fill="#9a958c" font-size="11">a miss stays a miss</text>
  </g>
  <g>
    <rect x="360" y="230" width="190" height="80" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="360" y="230" width="190" height="6" rx="3" fill="#6b9dff"/>
    <text x="374" y="256" fill="#e8e6e3" font-size="12.5" font-weight="600">Ambiguous → escalate</text>
    <text x="374" y="276" fill="#9a958c" font-size="11">cheap rules first, LLM judgment</text>
    <text x="374" y="291" fill="#9a958c" font-size="11">second, human last</text>
  </g>

  <!-- ROW 2: the bytes bypass -->
  <g>
    <rect x="620" y="230" width="320" height="80" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="620" y="230" width="320" height="6" rx="3" fill="#9a958c"/>
    <text x="634" y="256" fill="#e8e6e3" font-size="12.5" font-weight="600">Attachments → Drive (separate script)</text>
    <text x="634" y="276" fill="#9a958c" font-size="11">files move inside Google's own infrastructure —</text>
    <text x="634" y="291" fill="#9a958c" font-size="11">heavy bytes never touch the model's context</text>
  </g>

  <!-- caption -->
  <text x="30" y="370" fill="#7a766e" font-size="11" font-style="italic">governance is the feature: least-privilege credentials, a fixed allowlist of writable objects, and a human gate before anything counts as fact</text>
</svg>
