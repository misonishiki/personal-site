<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a958c"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d8a24a"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="#141312"/>

  <!-- legend -->
  <g font-size="11">
    <rect x="620" y="18" width="10" height="10" rx="2" fill="#6b9dff"/>
    <text x="636" y="27" fill="#9a958c">LLM-drafted</text>
    <rect x="740" y="18" width="10" height="10" rx="2" fill="#9a958c"/>
    <text x="756" y="27" fill="#9a958c">deterministic</text>
    <rect x="870" y="18" width="10" height="10" rx="2" fill="#d8a24a"/>
    <text x="886" y="27" fill="#9a958c">human-gated</text>
  </g>

  <!-- tier labels -->
  <g font-size="11" fill="#7a766e" letter-spacing="1.5">
    <text x="200" y="52">THE NEED · DOWNSTREAM — the report that started all this</text>
    <text x="200" y="192">THE FETCH — each section pulls only its own context</text>
    <text x="200" y="332">THE ENGINES — calculation and filing, mechanical first</text>
    <text x="200" y="472">THE RAW · UPSTREAM — organised before the model sees it</text>
  </g>

  <!-- TIER 1: the report -->
  <g>
    <rect x="200" y="60" width="320" height="90" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="200" y="60" width="320" height="6" rx="3" fill="#6b9dff"/>
    <text x="214" y="90" fill="#e8e6e3" font-size="13" font-weight="600">Report · opening sections</text>
    <text x="214" y="110" fill="#9a958c" font-size="11.5">client project history — scope,</text>
    <text x="214" y="126" fill="#9a958c" font-size="11.5">correspondence, decisions</text>
  </g>
  <g>
    <rect x="560" y="60" width="320" height="90" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="560" y="60" width="320" height="6" rx="3" fill="#6b9dff"/>
    <text x="574" y="90" fill="#e8e6e3" font-size="13" font-weight="600">Report · EoL sections</text>
    <text x="574" y="110" fill="#9a958c" font-size="11.5">standard practice + geographical</text>
    <text x="574" y="126" fill="#9a958c" font-size="11.5">assumptions — no history needed</text>
  </g>

  <!-- TIER 2: the fetch -->
  <g>
    <rect x="200" y="200" width="320" height="90" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="200" y="200" width="320" height="6" rx="3" fill="#9a958c"/>
    <text x="214" y="230" fill="#e8e6e3" font-size="13" font-weight="600">Correspondence log</text>
    <text x="214" y="250" fill="#9a958c" font-size="11.5">structured per-project history —</text>
    <text x="214" y="266" fill="#9a958c" font-size="11.5">proposed first, human-confirmed</text>
  </g>
  <g>
    <rect x="560" y="200" width="320" height="90" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="560" y="200" width="320" height="6" rx="3" fill="#d8a24a"/>
    <text x="574" y="230" fill="#e8e6e3" font-size="13" font-weight="600">Report snippets</text>
    <text x="574" y="250" fill="#9a958c" font-size="11.5">Approved rows only — matched on</text>
    <text x="574" y="266" fill="#9a958c" font-size="11.5">section + run settings, filled from export</text>
  </g>

  <!-- TIER 3: the engines -->
  <g>
    <rect x="200" y="340" width="320" height="90" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="200" y="340" width="320" height="6" rx="3" fill="#9a958c"/>
    <text x="214" y="370" fill="#e8e6e3" font-size="13" font-weight="600">The routine</text>
    <text x="214" y="390" fill="#9a958c" font-size="11.5">Gmail → sender match → proposed entry</text>
    <text x="214" y="406" fill="#9a958c" font-size="11.5">LLM only when rules are inconclusive</text>
  </g>
  <g>
    <rect x="560" y="340" width="320" height="90" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="560" y="340" width="320" height="6" rx="3" fill="#9a958c"/>
    <text x="574" y="370" fill="#e8e6e3" font-size="13" font-weight="600">EoL engine run</text>
    <text x="574" y="390" fill="#9a958c" font-size="11.5">config settings → calculation → export —</text>
    <text x="574" y="406" fill="#9a958c" font-size="11.5">same inputs, same answer, every time</text>
  </g>

  <!-- TIER 4: the raw -->
  <g>
    <rect x="200" y="480" width="320" height="90" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="200" y="480" width="320" height="6" rx="3" fill="#9a958c"/>
    <text x="214" y="510" fill="#e8e6e3" font-size="13" font-weight="600">Gmail + Drive</text>
    <text x="214" y="530" fill="#9a958c" font-size="11.5">scattered client history — inboxes,</text>
    <text x="214" y="546" fill="#9a958c" font-size="11.5">folders, someone's memory</text>
  </g>
  <g>
    <rect x="560" y="480" width="320" height="90" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="560" y="480" width="320" height="6" rx="3" fill="#d8a24a"/>
    <text x="574" y="510" fill="#e8e6e3" font-size="13" font-weight="600">Curated library</text>
    <text x="574" y="530" fill="#9a958c" font-size="11.5">families · variants · ~720 synonyms ·</text>
    <text x="574" y="546" fill="#9a958c" font-size="11.5">don't-suggest pairs · 389-name gold set</text>
  </g>

  <!-- data-flow arrows (upstream → downstream) -->
  <g stroke="#9a958c" stroke-width="1.5">
    <line x1="360" y1="478" x2="360" y2="434" marker-end="url(#arr2)"/>
    <line x1="360" y1="338" x2="360" y2="294" marker-end="url(#arr2)"/>
    <line x1="360" y1="198" x2="360" y2="154" marker-end="url(#arr2)"/>
    <line x1="720" y1="478" x2="720" y2="434" marker-end="url(#arr2)"/>
    <line x1="720" y1="338" x2="720" y2="294" marker-end="url(#arr2)"/>
    <line x1="720" y1="198" x2="720" y2="154" marker-end="url(#arr2)"/>
  </g>
  <text x="732" y="178" fill="#7a766e" font-size="10.5" font-style="italic">fetches only what's relevant</text>

  <!-- feedback loop (right): engine run → library -->
  <path d="M880,385 H935 V525 H884" fill="none" stroke="#d8a24a" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrO)"/>
  <text x="935" y="365" fill="#7a766e" font-size="10.5" text-anchor="end" font-style="italic">run corrections → pending-review intake · in build</text>
  <text x="935" y="565" fill="#7a766e" font-size="10.5" text-anchor="end" font-style="italic">Approved rows → next library version · live</text>

  <!-- THE CUT (left): the rejected path -->
  <g>
    <rect x="20" y="200" width="150" height="122" rx="6" fill="none" stroke="#d8a24a" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="34" y="226" fill="#d8a24a" font-size="11.5" font-weight="600">THE CUT ✗</text>
    <text x="34" y="248" fill="#9a958c" font-size="10.5">old reports as prompt</text>
    <text x="34" y="263" fill="#9a958c" font-size="10.5">examples — they</text>
    <text x="34" y="278" fill="#9a958c" font-size="10.5">contradicted each other</text>
    <text x="34" y="298" fill="#7a766e" font-size="10.5" font-style="italic">removed from context,</text>
    <text x="34" y="312" fill="#7a766e" font-size="10.5" font-style="italic">replaced by calculation</text>
  </g>
  <line x1="170" y1="212" x2="196" y2="152" stroke="#d8a24a" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="176" y="186" fill="#d8a24a" font-size="14">✗</text>

  <!-- caption -->
  <text x="500" y="606" fill="#7a766e" font-size="11" font-style="italic" text-anchor="middle">read it top-down as a dependency chain: nothing downstream exists until the layer upstream has organised it</text>
</svg>
