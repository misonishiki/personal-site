<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a958c"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="#141312"/>

  <!-- legend -->
  <g font-size="11">
    <rect x="700" y="18" width="10" height="10" rx="2" fill="#9a958c"/>
    <text x="716" y="27" fill="#9a958c">deterministic</text>
    <rect x="810" y="18" width="10" height="10" rx="2" fill="#6b9dff"/>
    <text x="826" y="27" fill="#9a958c">AI skill</text>
    <rect x="895" y="18" width="10" height="10" rx="2" fill="#d8a24a"/>
    <text x="911" y="27" fill="#9a958c">human</text>
  </g>

  <!-- workbook -->
  <g>
    <rect x="20" y="80" width="220" height="150" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="20" y="80" width="220" height="6" rx="3" fill="#9a958c"/>
    <text x="34" y="106" fill="#e8e6e3" font-size="13" font-weight="600">EoL Fixer workbook</text>
    <text x="34" y="126" fill="#9a958c" font-size="11.5">the contract: a contents tab</text>
    <text x="34" y="142" fill="#9a958c" font-size="11.5">declares every table, its status,</text>
    <text x="34" y="158" fill="#9a958c" font-size="11.5">and the reason for any gap</text>
    <text x="34" y="180" fill="#7a766e" font-size="10.5">tables + units + every number,</text>
    <text x="34" y="194" fill="#7a766e" font-size="10.5">already decided by code</text>
  </g>

  <!-- skill -->
  <g>
    <rect x="300" y="60" width="240" height="190" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="300" y="60" width="240" height="6" rx="3" fill="#6b9dff"/>
    <text x="314" y="86" fill="#e8e6e3" font-size="13" font-weight="600">Report-writer skill</text>
    <text x="314" y="106" fill="#9a958c" font-size="11.5">places each included table</text>
    <text x="314" y="122" fill="#9a958c" font-size="11.5">verbatim: headers, units, order</text>
    <text x="314" y="144" fill="#9a958c" font-size="11.5">writes narrative from approved</text>
    <text x="314" y="160" fill="#9a958c" font-size="11.5">snippets, no client history</text>
    <text x="314" y="182" fill="#7a766e" font-size="10.5">every number cited by fact ID ·</text>
    <text x="314" y="196" fill="#7a766e" font-size="10.5">never computes a number itself ·</text>
    <text x="314" y="210" fill="#7a766e" font-size="10.5">trace columns never leave home</text>
  </g>

  <!-- gap handling -->
  <g>
    <rect x="300" y="290" width="240" height="90" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="300" y="290" width="240" height="6" rx="3" fill="#9a958c"/>
    <text x="314" y="316" fill="#e8e6e3" font-size="13" font-weight="600">Empty or excluded table?</text>
    <text x="314" y="336" fill="#9a958c" font-size="11.5">surface the contract's reason,</text>
    <text x="314" y="352" fill="#9a958c" font-size="11.5">never rebuild the table by hand</text>
  </g>

  <!-- report -->
  <g>
    <rect x="600" y="80" width="160" height="150" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="600" y="80" width="160" height="6" rx="3" fill="#9a958c"/>
    <text x="614" y="106" fill="#e8e6e3" font-size="13" font-weight="600">Background report</text>
    <text x="614" y="126" fill="#9a958c" font-size="11.5">EoL sections in the</text>
    <text x="614" y="142" fill="#9a958c" font-size="11.5">house skeleton: tables,</text>
    <text x="614" y="158" fill="#9a958c" font-size="11.5">narrative, captions</text>
    <text x="614" y="180" fill="#7a766e" font-size="10.5">a live Word document the</text>
    <text x="614" y="194" fill="#7a766e" font-size="10.5">team may have open</text>
  </g>

  <!-- human -->
  <g>
    <rect x="800" y="80" width="140" height="150" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="800" y="80" width="140" height="6" rx="3" fill="#d8a24a"/>
    <text x="814" y="106" fill="#e8e6e3" font-size="13" font-weight="600">Modeller</text>
    <text x="814" y="126" fill="#9a958c" font-size="11.5">reviews the draft</text>
    <text x="814" y="142" fill="#9a958c" font-size="11.5">and the fact-ID</text>
    <text x="814" y="158" fill="#9a958c" font-size="11.5">list behind it</text>
    <text x="814" y="180" fill="#7a766e" font-size="10.5">approves before</text>
    <text x="814" y="194" fill="#7a766e" font-size="10.5">anything ships</text>
  </g>

  <!-- arrows -->
  <line x1="240" y1="155" x2="294" y2="155" stroke="#9a958c" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="540" y1="155" x2="594" y2="155" stroke="#9a958c" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="760" y1="155" x2="794" y2="155" stroke="#d8a24a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="420" y1="250" x2="420" y2="284" stroke="#9a958c" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
