<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a958c"/>
    </marker>
  </defs>
  <rect width="960" height="440" fill="#141312"/>

  <!-- legend -->
  <g font-size="11">
    <rect x="700" y="18" width="10" height="10" rx="2" fill="#9a958c"/>
    <text x="716" y="27" fill="#9a958c">deterministic</text>
    <rect x="830" y="18" width="10" height="10" rx="2" fill="#d8a24a"/>
    <text x="846" y="27" fill="#9a958c">human</text>
  </g>

  <!-- input -->
  <g>
    <rect x="20" y="80" width="170" height="90" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="20" y="80" width="170" height="6" rx="3" fill="#9a958c"/>
    <text x="34" y="106" fill="#e8e6e3" font-size="13" font-weight="600">Material name</text>
    <text x="34" y="126" fill="#9a958c" font-size="11.5">from the EoL scenario</text>
    <text x="34" y="142" fill="#9a958c" font-size="11.5">sheet, e.g. "constructiestaal"</text>
  </g>

  <!-- normalise -->
  <g>
    <rect x="240" y="80" width="170" height="90" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="240" y="80" width="170" height="6" rx="3" fill="#9a958c"/>
    <text x="254" y="106" fill="#e8e6e3" font-size="13" font-weight="600">Normalise</text>
    <text x="254" y="126" fill="#9a958c" font-size="11.5">lowercase, accents stripped,</text>
    <text x="254" y="142" fill="#9a958c" font-size="11.5">words only</text>
  </g>

  <!-- match -->
  <g>
    <rect x="460" y="60" width="220" height="130" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="460" y="60" width="220" height="6" rx="3" fill="#9a958c"/>
    <text x="474" y="86" fill="#e8e6e3" font-size="13" font-weight="600">Match against library</text>
    <text x="474" y="106" fill="#9a958c" font-size="11.5">most specific name-part first,</text>
    <text x="474" y="122" fill="#9a958c" font-size="11.5">then broader, then category</text>
    <text x="474" y="144" fill="#7a766e" font-size="10.5">Dutch compounds: the last part names</text>
    <text x="474" y="158" fill="#7a766e" font-size="10.5">what it is · one typo tolerated ·</text>
    <text x="474" y="172" fill="#7a766e" font-size="10.5">dont_suggest list blocks barred terms</text>
  </g>

  <!-- suggestion -->
  <g>
    <rect x="730" y="60" width="210" height="130" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="730" y="60" width="210" height="6" rx="3" fill="#9a958c"/>
    <text x="744" y="86" fill="#e8e6e3" font-size="13" font-weight="600">Suggestion + reason</text>
    <text x="744" y="106" fill="#9a958c" font-size="11.5">family or variant, confidence:</text>
    <text x="744" y="122" fill="#9a958c" font-size="11.5">exact · partial · guess</text>
    <text x="744" y="144" fill="#7a766e" font-size="10.5">reason always attached: which term,</text>
    <text x="744" y="158" fill="#7a766e" font-size="10.5">via synonym or family, reviewed or not</text>
  </g>

  <!-- library -->
  <g>
    <rect x="440" y="260" width="260" height="140" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="440" y="260" width="260" height="6" rx="3" fill="#9a958c"/>
    <text x="454" y="286" fill="#e8e6e3" font-size="13" font-weight="600">Default material library</text>
    <text x="454" y="306" fill="#9a958c" font-size="11.5">canonical materials as families</text>
    <text x="454" y="322" fill="#9a958c" font-size="11.5">with named variants + synonyms</text>
    <text x="454" y="344" fill="#7a766e" font-size="10.5">datasets scoped to database version</text>
    <text x="454" y="358" fill="#7a766e" font-size="10.5">(Ecoinvent, NMD) · defaults reviewed</text>
    <text x="454" y="372" fill="#7a766e" font-size="10.5">against archived runs over time</text>
  </g>

  <!-- manual fallback -->
  <g>
    <rect x="20" y="270" width="230" height="120" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="20" y="270" width="230" height="6" rx="3" fill="#d8a24a"/>
    <text x="34" y="296" fill="#e8e6e3" font-size="13" font-weight="600">No match? Picked by hand</text>
    <text x="34" y="316" fill="#9a958c" font-size="11.5">modeller selects the right library</text>
    <text x="34" y="332" fill="#9a958c" font-size="11.5">entry manually</text>
    <text x="34" y="354" fill="#7a766e" font-size="10.5">choice is registered in the shared folder</text>
    <text x="34" y="368" fill="#7a766e" font-size="10.5">and added to the synonym list</text>
  </g>

  <!-- human decision -->
  <g>
    <rect x="730" y="260" width="210" height="140" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="730" y="260" width="210" height="6" rx="3" fill="#d8a24a"/>
    <text x="744" y="286" fill="#e8e6e3" font-size="13" font-weight="600">Modeller decides</text>
    <text x="744" y="306" fill="#9a958c" font-size="11.5">accept the suggestion,</text>
    <text x="744" y="322" fill="#9a958c" font-size="11.5">or override it</text>
    <text x="744" y="344" fill="#7a766e" font-size="10.5">override requires written reasoning</text>
    <text x="744" y="358" fill="#7a766e" font-size="10.5">before the run continues · both land</text>
    <text x="744" y="372" fill="#7a766e" font-size="10.5">in the verification report</text>
  </g>

  <!-- arrows -->
  <line x1="190" y1="125" x2="234" y2="125" stroke="#9a958c" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="410" y1="125" x2="454" y2="125" stroke="#9a958c" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="680" y1="125" x2="724" y2="125" stroke="#9a958c" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="570" y1="260" x2="570" y2="196" stroke="#9a958c" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="835" y1="190" x2="835" y2="254" stroke="#d8a24a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="250" y1="330" x2="434" y2="330" stroke="#d8a24a" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
