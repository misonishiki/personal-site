<svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a958c"/>
    </marker>
    <marker id="arr3d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a564f"/>
    </marker>
  </defs>
  <rect width="960" height="580" fill="#141312"/>

  <!-- Activities -->
  <g>
    <rect x="30" y="150" width="250" height="92" rx="6" fill="#1b1a18" stroke="#6b9dff" stroke-width="1.5"/>
    <text x="44" y="174" fill="#e8e6e3" font-size="12.5" font-weight="600">Activity</text>
    <text x="44" y="192" fill="#9a958c" font-size="11">Pre-treatment of magnet scrap</text>
    <text x="44" y="206" fill="#9a958c" font-size="11">(milled, optimistic)</text>
    <text x="44" y="228" fill="#7a766e" font-size="10">demagnetize · clean · ball-mill</text>
  </g>
  <g>
    <rect x="30" y="380" width="250" height="92" rx="6" fill="#1b1a18" stroke="#6b9dff" stroke-width="1.5"/>
    <text x="44" y="404" fill="#e8e6e3" font-size="12.5" font-weight="600">Activity</text>
    <text x="44" y="422" fill="#9a958c" font-size="11">Molten salt electrolysis —</text>
    <text x="44" y="436" fill="#9a958c" font-size="11">low estimate, 50% recovery</text>
    <text x="44" y="458" fill="#7a766e" font-size="10">1 of 8 scenario variants</text>
  </g>

  <!-- Exchanges -->
  <g>
    <rect x="390" y="30" width="260" height="76" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <text x="404" y="54" fill="#e8e6e3" font-size="12" font-weight="600">Exchange — resource, in</text>
    <text x="404" y="72" fill="#9a958c" font-size="11">"Demagnetization — electricity"</text>
    <text x="404" y="88" fill="#7a766e" font-size="10.5">1.1 kWh/kg magnet</text>
  </g>
  <g>
    <rect x="390" y="150" width="260" height="76" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <text x="404" y="174" fill="#e8e6e3" font-size="12" font-weight="600">Exchange — product, out ★</text>
    <text x="404" y="192" fill="#9a958c" font-size="11">"milled magnet powder (ca 200 µm)"</text>
    <text x="404" y="208" fill="#7a766e" font-size="10.5">1 kg — is_reference</text>
  </g>
  <g>
    <rect x="390" y="270" width="260" height="76" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <text x="404" y="294" fill="#e8e6e3" font-size="12" font-weight="600">Exchange — resource, in</text>
    <text x="404" y="312" fill="#9a958c" font-size="11">"cleaned, demagnetized, ball-milled</text>
    <text x="404" y="326" fill="#9a958c" font-size="11">EOL magnet" — 6.45 kg</text>
  </g>
  <g>
    <rect x="390" y="430" width="260" height="76" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <text x="404" y="454" fill="#e8e6e3" font-size="12" font-weight="600">Exchange — product, out ★</text>
    <text x="404" y="472" fill="#9a958c" font-size="11">"Nd-Pr REM alloy (deposited at cathode)"</text>
    <text x="404" y="488" fill="#7a766e" font-size="10.5">1 kg — is_reference</text>
  </g>

  <!-- Right column: Material / Dataset / base / Source -->
  <g>
    <rect x="730" y="30" width="210" height="64" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <text x="744" y="54" fill="#e8e6e3" font-size="12" font-weight="600">Material</text>
    <text x="744" y="74" fill="#9a958c" font-size="11">"Electricity" — canonical</text>
  </g>
  <g>
    <rect x="730" y="124" width="210" height="64" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <text x="744" y="148" fill="#e8e6e3" font-size="12" font-weight="600">Dataset</text>
    <text x="744" y="168" fill="#9a958c" font-size="10.5">electricity, medium voltage, GLO</text>
  </g>
  <g>
    <rect x="730" y="240" width="210" height="64" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <text x="744" y="264" fill="#e8e6e3" font-size="12" font-weight="600">Activity</text>
    <text x="744" y="284" fill="#9a958c" font-size="11">electrolysis (virtual base)</text>
  </g>
  <g>
    <rect x="730" y="480" width="210" height="70" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <text x="744" y="504" fill="#e8e6e3" font-size="12" font-weight="600">Source</text>
    <text x="744" y="522" fill="#9a958c" font-size="10">doi:10.1007/s40831-018-0198-9</text>
    <text x="744" y="536" fill="#7a766e" font-size="10">Table S1, supplementary PDF</text>
  </g>

  <!-- edges -->
  <line x1="280" y1="175" x2="386" y2="80" stroke="#9a958c" stroke-width="1.5" marker-end="url(#arr3)"/>
  <text x="292" y="110" fill="#9a958c" font-size="10.5">CONSUMES</text>
  <line x1="280" y1="192" x2="386" y2="189" stroke="#9a958c" stroke-width="1.5" marker-end="url(#arr3)"/>
  <text x="296" y="182" fill="#9a958c" font-size="10.5">PRODUCES</text>
  <line x1="280" y1="405" x2="386" y2="315" stroke="#9a958c" stroke-width="1.5" marker-end="url(#arr3)"/>
  <text x="292" y="348" fill="#9a958c" font-size="10.5">CONSUMES</text>
  <line x1="280" y1="440" x2="386" y2="462" stroke="#9a958c" stroke-width="1.5" marker-end="url(#arr3)"/>
  <text x="296" y="466" fill="#9a958c" font-size="10.5">PRODUCES</text>

  <!-- FEEDS back -->
  <path d="M390,300 C300,290 200,280 155,246" stroke="#d8a24a" stroke-width="1.5" fill="none" marker-end="url(#arr3)"/>
  <text x="196" y="272" fill="#d8a24a" font-size="10.5">FEEDS — the chain link</text>

  <!-- naming mismatch -->
  <path d="M520,226 L520,266" stroke="#5a564f" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arr3d)" fill="none"/>
  <text x="532" y="250" fill="#5a564f" font-size="10.5">same stuff, different strings — linkage is a matching problem</text>

  <!-- INSTANCE_OF / FROM_DATASET -->
  <line x1="650" y1="62" x2="726" y2="62" stroke="#9a958c" stroke-width="1.5" marker-end="url(#arr3)"/>
  <text x="656" y="52" fill="#9a958c" font-size="10.5">INSTANCE_OF</text>
  <path d="M650,90 C690,105 700,120 726,140" stroke="#9a958c" stroke-width="1.5" fill="none" marker-end="url(#arr3)"/>
  <text x="664" y="116" fill="#9a958c" font-size="10.5">FROM_DATASET</text>

  <!-- VARIANT_OF -->
  <path d="M280,426 C500,400 640,330 726,280" stroke="#9a958c" stroke-width="1.5" fill="none" marker-end="url(#arr3)"/>
  <text x="480" y="392" fill="#9a958c" font-size="10.5">VARIANT_OF {estimate: low, recovery: 0.50}</text>

  <!-- SOURCED_FROM dashed -->
  <path d="M520,506 C520,540 640,530 726,518" stroke="#5a564f" stroke-width="1.2" stroke-dasharray="4 4" fill="none" marker-end="url(#arr3d)"/>
  <path d="M155,472 C155,545 600,545 726,522" stroke="#5a564f" stroke-width="1.2" stroke-dasharray="4 4" fill="none" marker-end="url(#arr3d)"/>
  <text x="380" y="556" fill="#5a564f" font-size="10.5">SOURCED_FROM — every node traces back to the paper</text>

  <!-- conversion callout -->
  <text x="30" y="28" fill="#7a766e" font-size="11">Study 34 — NdFeB magnet recycling. Upstream</text>
  <text x="30" y="43" fill="#7a766e" font-size="11">amounts are per kg of powder, downstream per kg</text>
  <text x="30" y="58" fill="#7a766e" font-size="11">of alloy — the 6.45 on the FEEDS link is the</text>
  <text x="30" y="73" fill="#7a766e" font-size="11">conversion the roll-up math multiplies through.</text>
</svg>
