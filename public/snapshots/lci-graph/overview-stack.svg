<svg viewBox="0 0 960 610" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a958c"/>
    </marker>
  </defs>
  <rect width="960" height="610" fill="#141312"/>

  <!-- legend -->
  <g font-size="11">
    <rect x="560" y="18" width="10" height="10" rx="2" fill="#6b9dff"/>
    <text x="576" y="27" fill="#9a958c">LLM proposes</text>
    <rect x="680" y="18" width="10" height="10" rx="2" fill="#9a958c"/>
    <text x="696" y="27" fill="#9a958c">deterministic</text>
    <rect x="800" y="18" width="10" height="10" rx="2" fill="#d8a24a"/>
    <text x="816" y="27" fill="#9a958c">human</text>
  </g>

  <!-- 1 INPUTS -->
  <text x="20" y="56" fill="#7a766e" font-size="10" text-transform="uppercase" letter-spacing="1">SOURCES</text>
  <g>
    <rect x="20" y="64" width="440" height="52" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <text x="34" y="86" fill="#e8e6e3" font-size="12" font-weight="600">Papers + supplements</text>
    <text x="34" y="104" fill="#7a766e" font-size="10.5">pdf · docx · xlsx — LCI tables, methodology, footnotes</text>
    <rect x="500" y="64" width="440" height="52" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <text x="514" y="86" fill="#e8e6e3" font-size="12" font-weight="600">Industrial bill of materials</text>
    <text x="514" y="104" fill="#7a766e" font-size="10.5">ERP export — deterministic import, no model involved</text>
  </g>

  <!-- 2 EXTRACTION -->
  <text x="20" y="146" fill="#7a766e" font-size="10" letter-spacing="1">EXTRACTION</text>
  <g>
    <rect x="20" y="154" width="700" height="60" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="20" y="154" width="350" height="6" rx="3" fill="#6b9dff"/>
    <rect x="370" y="154" width="350" height="6" rx="3" fill="#9a958c"/>
    <text x="34" y="180" fill="#e8e6e3" font-size="12" font-weight="600">Routing gate → multi-pass LLM extraction → validation + acceptance gate</text>
    <text x="34" y="200" fill="#7a766e" font-size="10.5">the model drafts; deterministic rules decide; critical gate failures hard-block the ingest</text>
  </g>

  <!-- 3 STORE -->
  <text x="20" y="244" fill="#7a766e" font-size="10" letter-spacing="1">STORE</text>
  <g>
    <rect x="20" y="252" width="700" height="52" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="20" y="252" width="700" height="6" rx="3" fill="#9a958c"/>
    <text x="34" y="276" fill="#e8e6e3" font-size="12" font-weight="600">SQLite — studies · processes · flows · materials · append-only decision log</text>
    <text x="34" y="294" fill="#7a766e" font-size="10.5">amounts verbatim, methodology pinned, every exchange traced to its source DOI</text>
  </g>

  <!-- 4 IDENTITY -->
  <text x="20" y="334" fill="#7a766e" font-size="10" letter-spacing="1">IDENTITY</text>
  <g>
    <rect x="20" y="342" width="450" height="72" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="20" y="342" width="450" height="6" rx="3" fill="#9a958c"/>
    <text x="34" y="366" fill="#e8e6e3" font-size="12" font-weight="600">Memory lookup — aliases · dataset map</text>
    <text x="34" y="384" fill="#9a958c" font-size="10.5">key hit → auto-match (unicode-fold + synonym lenses)</text>
    <text x="34" y="400" fill="#7a766e" font-size="10">rebuilt from the decision log; never asks twice</text>
    <rect x="490" y="342" width="230" height="72" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="490" y="342" width="230" height="6" rx="3" fill="#d8a24a"/>
    <text x="504" y="366" fill="#e8e6e3" font-size="12" font-weight="600">No key → human review</text>
    <text x="504" y="384" fill="#9a958c" font-size="10.5">Flow Mapping buckets · Dedup merges</text>
    <text x="504" y="400" fill="#7a766e" font-size="10">grouped by dataset key + exchange class</text>
  </g>

  <!-- 5 GRAPH -->
  <text x="20" y="444" fill="#7a766e" font-size="10" letter-spacing="1">GRAPH</text>
  <g>
    <rect x="20" y="452" width="700" height="52" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="20" y="452" width="700" height="6" rx="3" fill="#9a958c"/>
    <text x="34" y="476" fill="#e8e6e3" font-size="12" font-weight="600">Disposable graph projection — Activity · Exchange · Material · Dataset · Source</text>
    <text x="34" y="494" fill="#7a766e" font-size="10.5">rebuilt on demand; decision history stays relational</text>
  </g>

  <!-- 6 OUTPUTS -->
  <text x="20" y="534" fill="#7a766e" font-size="10" letter-spacing="1">OUTPUTS</text>
  <g>
    <rect x="20" y="542" width="290" height="52" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="20" y="542" width="290" height="6" rx="3" fill="#d8a24a"/>
    <text x="34" y="566" fill="#e8e6e3" font-size="12" font-weight="600">Web platform</text>
    <text x="34" y="584" fill="#7a766e" font-size="10.5">browse · search · review</text>
    <rect x="330" y="542" width="290" height="52" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="330" y="542" width="290" height="6" rx="3" fill="#9a958c"/>
    <text x="344" y="566" fill="#e8e6e3" font-size="12" font-weight="600">Exports</text>
    <text x="344" y="584" fill="#7a766e" font-size="10.5">openLCA · SimaPro · ecoSpold · ILCD</text>
    <rect x="640" y="542" width="300" height="52" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="640" y="542" width="300" height="6" rx="3" fill="#9a958c"/>
    <text x="654" y="566" fill="#e8e6e3" font-size="12" font-weight="600">Meta-analysis</text>
    <text x="654" y="584" fill="#7a766e" font-size="10.5">cross-paper questions on canonical materials</text>
  </g>

  <!-- flow arrows (down the spine) -->
  <g stroke="#9a958c" stroke-width="1.5" fill="none">
    <path d="M240,116 L240,150" marker-end="url(#arr)"/>
    <path d="M700,116 L700,248" marker-end="url(#arr)"/>
    <text x="708" y="150" fill="#7a766e" font-size="9.5">direct import</text>
    <path d="M240,214 L240,248" marker-end="url(#arr)"/>
    <path d="M240,304 L240,338" marker-end="url(#arr)"/>
    <path d="M240,414 L240,448" marker-end="url(#arr)"/>
    <path d="M240,504 L240,538" marker-end="url(#arr)"/>
    <!-- review → decision log loop -->
    <path d="M720,378 L770,378 L770,278 L724,278" stroke-dasharray="4 4" marker-end="url(#arr)"/>
    <text x="778" y="318" fill="#7a766e" font-size="9.5">every decision appended</text>
    <text x="778" y="331" fill="#7a766e" font-size="9.5">to the log → memory grows</text>
  </g>
</svg>
