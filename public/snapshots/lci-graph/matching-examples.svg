<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a958c"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#141312"/>

  <!-- ══ LEFT: typography — three names, one substance ══ -->
  <text x="30" y="34" fill="#e8e6e3" font-size="13" font-weight="600">Typography — three papers, three spellings</text>

  <!-- raw flow cards -->
  <g font-size="11">
    <rect x="30" y="52" width="230" height="64" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <text x="44" y="74" fill="#e8e6e3" font-size="12" font-weight="600">Co₂</text>
    <text x="44" y="92" fill="#7a766e" font-size="10.5">ds: [Custom defined]</text>
    <text x="44" y="107" fill="#7a766e" font-size="10.5">class: output_emission</text>

    <rect x="30" y="128" width="230" height="64" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <text x="44" y="150" fill="#e8e6e3" font-size="12" font-weight="600">Co2</text>
    <text x="44" y="168" fill="#7a766e" font-size="10.5">ds: Carbon dioxide, fossil, to air</text>
    <text x="44" y="183" fill="#7a766e" font-size="10.5">class: output_emission</text>

    <rect x="30" y="204" width="230" height="64" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <text x="44" y="226" fill="#e8e6e3" font-size="12" font-weight="600">Carbon dioxide</text>
    <text x="44" y="244" fill="#7a766e" font-size="10.5">ds: not specified</text>
    <text x="44" y="259" fill="#7a766e" font-size="10.5">class: output_emission</text>
  </g>

  <!-- lens annotation -->
  <g>
    <rect x="290" y="128" width="130" height="64" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="290" y="128" width="130" height="6" rx="3" fill="#9a958c"/>
    <text x="302" y="152" fill="#9a958c" font-size="10.5">unicode-fold</text>
    <text x="302" y="167" fill="#9a958c" font-size="10.5">+ synonym table</text>
    <text x="302" y="184" fill="#7a766e" font-size="9.5">auto-match at ingest</text>
  </g>

  <!-- canonical result -->
  <g>
    <rect x="290" y="300" width="240" height="76" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="290" y="300" width="240" height="6" rx="3" fill="#d8a24a"/>
    <text x="304" y="326" fill="#e8e6e3" font-size="12" font-weight="600">canonical: Carbon dioxide</text>
    <text x="304" y="345" fill="#9a958c" font-size="10.5">aliases: Co₂ · Co2</text>
    <text x="304" y="362" fill="#7a766e" font-size="10">merge logged one decision per name — sticks forever</text>
  </g>

  <!-- ══ RIGHT: role — same substance, different claim ══ -->
  <text x="520" y="34" fill="#e8e6e3" font-size="13" font-weight="600">Role — same substance, opposite claims</text>

  <g font-size="11">
    <rect x="520" y="52" width="200" height="76" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="520" y="52" width="200" height="6" rx="3" fill="#6b9dff"/>
    <text x="534" y="76" fill="#e8e6e3" font-size="12" font-weight="600">silicon carbide — consumption</text>
    <text x="534" y="95" fill="#7a766e" font-size="10.5">ds: market for silicon carbide</text>
    <text x="534" y="110" fill="#7a766e" font-size="10.5">class: input — a burden you buy</text>

    <rect x="520" y="140" width="200" height="76" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="520" y="140" width="200" height="6" rx="3" fill="#d8a24a"/>
    <text x="534" y="164" fill="#e8e6e3" font-size="12" font-weight="600">silicon carbide — disposal</text>
    <text x="534" y="183" fill="#7a766e" font-size="10.5">ds: treatment of spent slurry</text>
    <text x="534" y="198" fill="#7a766e" font-size="10.5">class: waste — a burden you pay for</text>

    <rect x="520" y="228" width="200" height="76" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <rect x="520" y="228" width="200" height="6" rx="3" fill="#7bc98f"/>
    <text x="534" y="252" fill="#e8e6e3" font-size="12" font-weight="600">silicon carbide — recovered</text>
    <text x="534" y="271" fill="#7a766e" font-size="10.5">ds: market for silicon carbide</text>
    <text x="534" y="286" fill="#7a766e" font-size="10.5">class: avoided product — a credit</text>
  </g>

  <!-- same normalized key callout -->
  <g>
    <rect x="748" y="100" width="182" height="120" rx="6" fill="#1b1a18" stroke="#2c2a26"/>
    <text x="762" y="124" fill="#9a958c" font-size="10.5">same normalized</text>
    <text x="762" y="139" fill="#9a958c" font-size="10.5">dataset key:</text>
    <text x="762" y="160" fill="#e8e6e3" font-size="11" font-family="ui-monospace, monospace">silicon carbide</text>
    <text x="762" y="184" fill="#7a766e" font-size="10">buckets split by class —</text>
    <text x="762" y="199" fill="#7a766e" font-size="10">never decided together</text>
  </g>

  <!-- edges -->
  <g stroke="#9a958c" stroke-width="1.5" fill="none">
    <path d="M260,84 L286,140" marker-end="url(#arr)"/>
    <path d="M260,160 L286,160" marker-end="url(#arr)"/>
    <path d="M260,236 L286,180" marker-end="url(#arr)"/>
    <path d="M355,192 L380,296" marker-end="url(#arr)"/>
    <path d="M720,90 L744,115" marker-end="url(#arr)"/>
    <path d="M720,178 L744,165" marker-end="url(#arr)"/>
    <path d="M720,266 L744,205" marker-end="url(#arr)"/>
  </g>

  <!-- divider -->
  <line x1="480" y1="52" x2="480" y2="288" stroke="#2c2a26" stroke-width="1"/>

  <!-- footnote -->
  <text x="480" y="402" fill="#7a766e" font-size="10.5" text-anchor="middle">what the matcher took from each flow: the name (folded), the dataset string (normalized), and the exchange class (the sign of the claim)</text>
</svg>
